<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · CQU NetProbe Gateway</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<header class="topbar">
  <span class="brand">CQU NetProbe Gateway</span>
  {{if .Username}}
  <nav>
    <a href="/admin">Probes</a>
    <a href="/admin/campuses">校区</a>
    <a href="/admin/buildings">楼栋</a>
    <a href="/admin/targets">Targets</a>
  </nav>
  <form method="post" action="/admin/logout" class="inline">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <button type="submit" class="link">登出 ({{.Username}})</button>
  </form>
  {{end}}
</header>
<main>
{{template "content" .}}
</main>

{{/* Confirmation for destructive actions. app.js fills in the message and
     opens it; a browser that never runs the script falls back to the inline
     confirm() each form carries. */}}
<dialog class="modal" id="confirm-dialog" aria-labelledby="confirm-dialog-title">
  <form method="dialog">
    <h2 id="confirm-dialog-title">确认操作</h2>
    <p class="modal-message"></p>
    <div class="modal-actions">
      <button value="cancel" class="btn secondary" autofocus>取消</button>
      <button value="confirm" class="btn danger">确认</button>
    </div>
  </form>
</dialog>
</body>
</html>
