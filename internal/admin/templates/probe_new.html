{{define "content"}}
<div class="card narrow">
  <h1>新建 Probe</h1>
  {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
  <form method="post" action="/admin/probes/new">
    <input type="hidden" name="csrf" value="{{.CSRF}}">

    <h2>位置</h2>
    {{if .Pages.empty}}
      <p class="notice">
        还没有配置校区。请先到 <a href="/admin/campuses">校区</a> 与
        <a href="/admin/buildings">楼栋</a> 页面建立目录，再回来创建探针。
      </p>
    {{else}}
    <label>校区
      <div class="select">
        <select name="campus_code" required>
          {{$sel := .Pages.campus}}
          {{range .Pages.campuses}}
            <option value="{{.Code}}" {{if eq .Code $sel}}selected{{end}}>{{.Name}} ({{.Code}})</option>
          {{end}}
        </select>
      </div>
    </label>
    <label>楼栋
      <div class="select">
        <select name="building_code" required>
          {{range .Pages.buildings}}<option value="{{.Code}}">{{.Name}} ({{.Code}})</option>{{end}}
        </select>
      </div>
    </label>
    {{end}}

    <h2>网络类型</h2>
    <label>类型
      <div class="select">
        <select name="network_type" required>
          <option value="wired">wired</option>
          <option value="wireless">wireless</option>
        </select>
      </div>
    </label>

    <h2>备注</h2>
    <label>备注（不会进入 Prometheus Label）
      <textarea name="description" rows="3">{{.Pages.form.description}}</textarea>
    </label>

    <button type="submit">创建</button>
  </form>
  <p class="muted">Probe ID 由 校区代号-楼栋代号-随机串 组成，创建后不可更改。</p>
</div>
{{end}}
