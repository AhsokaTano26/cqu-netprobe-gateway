# CQU NetProbe Gateway — Alertmanager 配置
#
# 每栋楼一个 Uptime Kuma Push 监控，按 `building` Label 平铺匹配。
# 楼栋代号全站唯一（不区分校区），所以不需要按校区或楼群嵌套。
#
# 使用前：
#   1. 把 kuma.example.com 换成你的 Uptime Kuma 地址；
#   2. 每个 receiver 的 TOKEN-xxx 换成 Kuma 里对应 Push 监控的 token。
#      TOKEN-a01 对应的那个监控就该叫 "a01"，与 receiver 后缀一一对应；
#   3. amtool check-config alertmanager.yml 验证一遍再 reload。
#
# 本文件由 docs/buildings.md 生成，楼栋列表变动后重新生成，不要手改中间部分。

global:
  resolve_timeout: 5m

route:
  # 兜底：不带 building Label 的告警落在这里。Alertmanager 必须有一个根
  # receiver，这个位置省不掉。
  #
  # 按当前的 8 条规则，落到这里的是 6 条：NetProbeGatewayDown、
  # NetProbePushRejected、NetProbeStaleConfigNotRefetched、NetProbeTokenGuessing、
  # NetProbeCollectFailing——这五条是聚合表达式，不带任何 identity Label；
  # 再加上 NetProbeCampusMostlyOffline，它只带 campus。
  # 只有剩下 2 条（NetProbeProbeOffline、NetProbeHighPacketLoss）带 building，
  # 会落到下面那 70 个楼栋 receiver 上。
  receiver: kuma-gateway
  # 每栋楼各自成组，一个楼出问题不会把别处的告警挤进同一条通知。
  group_by: ['alertname', 'campus', 'building_group', 'building']
  group_wait: 30s
  group_interval: 5m
  # 告警持续不恢复时的重发间隔。注意：Kuma 的 Push 监控靠这个间隔维持状态，
  # 把它调得比 Kuma 监控的 Heartbeat Interval 还长，监控会先超时变 DOWN。
  repeat_interval: 4h

  routes:
    # ---- A区（spba）----
    - matchers: [building="a01"]
      receiver: kuma-a01   # A区1舍
    - matchers: [building="a02"]
      receiver: kuma-a02   # A区2舍
    - matchers: [building="a03"]
      receiver: kuma-a03   # A区3舍
    - matchers: [building="a04"]
      receiver: kuma-a04   # A区4舍
    - matchers: [building="a05"]
      receiver: kuma-a05   # A区5舍
    - matchers: [building="a06"]
      receiver: kuma-a06   # A区6舍
    - matchers: [building="a07"]
      receiver: kuma-a07   # A区7舍
    - matchers: [building="a08"]
      receiver: kuma-a08   # A区8舍
    - matchers: [building="a09"]
      receiver: kuma-a09   # A区9舍
    - matchers: [building="a10"]
      receiver: kuma-a10   # A区10舍
    - matchers: [building="a11"]
      receiver: kuma-a11   # A区11舍
    - matchers: [building="a12"]
      receiver: kuma-a12   # A区12舍
    - matchers: [building="acd"]
      receiver: kuma-acd   # ACD楼
    - matchers: [building="xuelin"]
      receiver: kuma-xuelin   # 学林宾馆

    # ---- B区（spbb）----
