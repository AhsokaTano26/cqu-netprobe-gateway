# 网关抓不到时，下面那些基于指标的告警全是噪声——它们只是抓取失败的后果，
# 不是新的故障。没有 equal，所以抑制是无条件的。不需要就整段删掉。
inhibit_rules:
  - source_matchers: [alertname="NetProbeGatewayDown"]
    target_matchers: [severity=~"warning|critical"]

