# CQU NetProbe Gateway — Alertmanager 配置
#
# 按 校区 -> 楼栋群 -> 楼栋 三级划分，每一级各自对应 Uptime Kuma 上的一个
# Push 监控。告警带哪些 Label 就落到哪一级：
#
#   campus only                  -> kuma-<campus>
#   campus + building_group      -> kuma-<campus>-<group>
#   campus + building_group + building -> kuma-<campus>-<building>
#   没有 campus（网关自身告警）   -> kuma-gateway（兜底）
#
# 使用前：
#   1. 把 kuma.example.com 换成你的 Uptime Kuma 地址；
#   2. 每个 receiver 的 TOKEN-xxx 换成 Kuma 里对应 Push 监控的 token；
#      TOKEN-xxx 的 xxx 就是这个监控该叫什么，例如 TOKEN-hx-sy01 -> "hx-sy01"；
#   3. amtool check-config alertmanager.yml 验证一遍再 reload。
#
# 本文件由 docs/buildings.md 生成，楼栋列表变动后重新生成，不要手改中间部分。

global:
  resolve_timeout: 5m

route:
  # 没有 campus Label 的告警走这里：up{} 抓取失败、网关自身的计数器。
  receiver: kuma-gateway
  # 每栋楼各自成组，一个楼出问题不会把别处的告警挤进同一条通知。
  group_by: ['alertname', 'campus', 'building_group', 'building']
  group_wait: 30s
  group_interval: 5m
  # 告警持续不恢复时的重发间隔。注意：Kuma 的 Push 监控靠这个间隔维持状态，
  # 把它调得比 Kuma 监控的 Heartbeat Interval 还长，监控会先超时变 DOWN。
  repeat_interval: 4h

  routes:
    # ---- A区（spba）----
    - matchers:
        - campus="spba"
      receiver: kuma-spba
      routes:
        - matchers:
            - building_group="a_dorm"
          receiver: kuma-spba-a_dorm   # A区 / A区学生宿舍
          routes:
            - matchers:
                - building="a01"
              receiver: kuma-spba-a01   # A区1舍
            - matchers:
                - building="a02"
              receiver: kuma-spba-a02   # A区2舍
            - matchers:
                - building="a03"
              receiver: kuma-spba-a03   # A区3舍
            - matchers:
                - building="a04"
              receiver: kuma-spba-a04   # A区4舍
            - matchers:
                - building="a05"
              receiver: kuma-spba-a05   # A区5舍
            - matchers:
                - building="a06"
              receiver: kuma-spba-a06   # A区6舍
            - matchers:
                - building="a07"
              receiver: kuma-spba-a07   # A区7舍
            - matchers:
                - building="a08"
              receiver: kuma-spba-a08   # A区8舍
            - matchers:
