              receiver: kuma-spba-a11   # A区11舍
            - matchers:
                - building="a12"
              receiver: kuma-spba-a12   # A区12舍
        - matchers:
            - building_group="a_acd"
          receiver: kuma-spba-a_acd   # A区 / A区acd楼
          routes:
            - matchers:
                - building="acd"
              receiver: kuma-spba-acd   # ACD楼
        - matchers:
            - building_group="a_hotel"
          receiver: kuma-spba-a_hotel   # A区 / A区学林宾馆
          routes:
            - matchers:
                - building="xuelin"
              receiver: kuma-spba-xuelin   # 学林宾馆

    # ---- B区（spbb）----
