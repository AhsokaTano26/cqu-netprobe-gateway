name: Release

on:
  push:
    tags: ["v*"]

# Docker Hub needs no GitHub permission: the registry credentials are the two
# secrets below, and this job only reads the repository.
permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fail here rather than at the push. A missing secret does not stop
      # metadata-action: it expands the image name to "/cqu-netprobe-gateway",
      # and the job then dies on a registry error that names neither secret.
      - name: Check Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Set the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets. The token is a Docker Hub access token with Read & Write scope, not the account password."
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      # No registry input: docker/login-action defaults to Docker Hub.
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/cqu-netprobe-gateway
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=true

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64
          # Attestation manifests turn the tag into an index carrying extra
          # blobs. Docker Hub accepts them, but older docker and podman clients
          # warn about unknown media types when pulling, and nothing in this
          # deployment consumes the attestations. A plain multi-arch index is
          # what `docker compose pull` expects.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
